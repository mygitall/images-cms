# ============================================================
#  Nginx 配置 — VPS 部署用
#  将此内容放入 /etc/nginx/sites-available/你的域名 的 server{} 块
#  完成后: nginx -t && systemctl reload nginx
# ============================================================

# ---- PHP 通用处理 ----
location ~ \.php$ {
    include fastcgi.conf;
    # Ubuntu/Debian 用这个路径；CentOS/Alma 用 /var/run/php-fpm/www.sock
    fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}

# ---- SPA 入口（index.php 检测安装锁） ----
index index.php;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# ---- 安装向导 ----
location /install/ {
    try_files $uri $uri/ /install/index.php?$query_string;
}

# ---- images20 后台 ----
location /images20/ {
    try_files $uri $uri/ /images20/index.php?$query_string;
}

# ---- 敏感文件保护 ----
location ~ /\.(env|git|htaccess) {
    deny all;
    return 404;
}
