# Nginx 配置 — 将此文件内容放入服务器配置的 server {} 块中
# 如果用宝塔面板，粘贴到对应网站的「伪静态」设置中

# 首页重定向到 dist/
location = / {
    return 302 /dist/;
}

# dist/ 静态文件直接返回
location /dist/ {
    # Vite 构建产物，长期缓存
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# cases.json / style-library.json / images 从 dist/ 读取
location ~ ^/(cases\.json|style-library\.json)$ {
    rewrite ^/(.*)$ /dist/$1 last;
}
location /images/ {
    rewrite ^/images/(.*)$ /dist/images/$1 last;
}

# API 路由 — 转发到 .php 文件
location /api/ {
    # PHP 文件直接交给 FastCGI
    location ~ ^/api/.+\.php$ {
        include fastcgi.conf;
        fastcgi_pass unix:/tmp/php-cgi-81.sock;  # PHP 8.1 socket，根据实际修改
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # API 路由重写
    rewrite ^/api/me$ /api/me.php last;
    rewrite ^/api/favorites$ /api/favorites.php last;
    rewrite ^/api/auth$ /api/auth.php last;
    rewrite ^/api/admin/users$ /api/admin/users.php last;
    rewrite ^/api/admin/metrics$ /api/admin/metrics.php last;
    rewrite ^/api/admin/credits/adjust$ /api/admin/credits-adjust.php last;
    rewrite ^/api/billing/plans$ /api/billing/plans.php last;
    rewrite ^/api/generate-image$ /api/generate-image.php last;
    rewrite ^/api/generation-history$ /api/generation-history.php last;
    rewrite ^/api/generation-delete$ /api/generation-delete.php last;
    rewrite ^/api/models$ /api/models.php last;
    rewrite ^/api/admin/api-config$ /api/admin/api-config.php last;

    # 其余 API 请求返回 503
    return 503;
}

# images20 子目录 — 直接透传 PHP
location /images20/ {
    # PHP 文件通过 FastCGI
    location ~ ^/images20/.+\.php$ {
        include fastcgi.conf;
        fastcgi_pass unix:/tmp/php-cgi-81.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    # 静态文件直接返回
    try_files $uri $uri/ =404;
}

# 禁止访问敏感文件
location ~ /\.(env|git|htaccess) {
    deny all;
    return 404;
}
location ~ /(composer\.json|composer\.lock|package\.json|package-lock\.json) {
    deny all;
    return 404;
}
